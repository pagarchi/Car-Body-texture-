# Put this file at .github/workflows/build.yml in your repo, next to main.cpp
name: Build BodyTex ASI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Clone plugin-sdk
        shell: pwsh
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git
      - name: Build plugin-sdk lib (Win32)
        shell: pwsh
        run: |
          Get-ChildItem plugin-sdk -Directory | ForEach-Object { Write-Host "DIR: $($_.Name)" }
          $lua = Get-ChildItem plugin-sdk -Recurse -Filter premake5.lua | Select-Object -First 1
          $exe = Get-ChildItem plugin-sdk -Recurse -Filter premake5.exe | Select-Object -First 1
          if (-not $lua) { Write-Host "ERROR: premake5.lua not found anywhere"; exit 1 }
          if (-not $exe) { Write-Host "ERROR: premake5.exe not found anywhere"; exit 1 }
          Write-Host "lua: $($lua.FullName)"
          Write-Host "exe: $($exe.FullName)"
          $env:PLUGIN_SDK_DIR = "$PWD\plugin-sdk"
          Push-Location $lua.DirectoryName
          & $exe.FullName vs2022
          $sln = Get-ChildItem "$env:PLUGIN_SDK_DIR" -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $sln) { & $exe.FullName vs2019 }
          Pop-Location
          $sln = Get-ChildItem "$env:PLUGIN_SDK_DIR" -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $sln) { Write-Host "ERROR: no .sln generated"; exit 1 }
          Write-Host "sln: $($sln.FullName)"
          Select-String -Path $sln.FullName -Pattern '^Project' | ForEach-Object { Write-Host $_.Line }
          msbuild $sln.FullName /t:plugin_sa /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: msbuild failed (see project list above)"; exit 1 }
          Get-ChildItem $env:PLUGIN_SDK_DIR -Recurse -Filter *.lib | Where-Object { $_.FullName -notmatch 'shared' } | ForEach-Object { Write-Host "LIB: $($_.FullName)" }
      - name: Compile BodyTex.asi
        shell: pwsh
        run: |
          $sdk = "$PWD\plugin-sdk"
          $lib = (Get-ChildItem -Path $sdk -Recurse -Filter "*.lib" | Where-Object { $_.FullName -notmatch 'shared' -and $_.Name -match 'plugin' } | Select-Object -First 1).FullName
          if (-not $lib) { Write-Host "ERROR: plugin lib not found"; exit 1 }
          Write-Host "Using lib: $lib"
          cl /nologo /LD /EHsc /MT /O2 /std:c++17 `
            /DGTASA /D_GTA_SA /DPLUGIN_SGV_10US /DRW /D_CRT_SECURE_NO_WARNINGS /D_USE_MATH_DEFINES `
            /I"$sdk\shared" /I"$sdk\shared\game" /I"$sdk\plugin_sa" /I"$sdk\plugin_sa\game_sa" /I"$sdk\plugin_sa\game_sa\rw" `
            main.cpp /Fe:BodyTex.asi /link "$lib" user32.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: BodyTex-asi
          path: BodyTex.asi
